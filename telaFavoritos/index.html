<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-content">

    <div class="search-container">
        <input 
            type="text" 
            class="search-input" 
            placeholder="Spark" 
            aria-label="Barra de pesquisa"
        >
        
        <button type="submit" class="search-button">
            <i class="fas fa-search"></i> </button>
    </div>



        <a href="#" class="favorite-container">
            <span class="plus-icon">
                <i class="fas fa-plus"></i>
            </span>
            <span class="favorite-text">
                Adicionar Parque Favorito
            </span>
        </a>

        <nav class="nav-bar">
        <a href="#" class="nav-item" aria-label="Amigos">
            <i class="fas fa-user-friends"></i>
            <span>Amigos</span>
        </a>

        <a href="#" class="nav-item" aria-label="Atividades">
            <i class="fas fa-running"></i>
            <span>Atividades</span>
        </a>
        
        <a href="#" class="nav-item nav-home" aria-label="Início">
            <i class="fas fa-home"></i>
            <span>Início</span>
        </a>
        
        <a href="#" class="nav-item nav-favorites" aria-label="Favoritas">
            <div class="highlight-circle">
                <i class="fas fa-star"></i>
            </div>
            <span>Favoritas</span>
        </a>
        
        <a href="#" class="nav-item" aria-label="Conta">
            <i class="fas fa-user-circle"></i>
            <span>Conta</span>
        </a>
    </nav>
    </div>

    

</body>
</html>
