<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark - Página Inicial</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <!-- Barra de Pesquisa -->
        <header class="header">
            <input type="text" class="search-bar" placeholder="Pesquisar">
            <h1>Spark</h1>
        </header>

        <!-- Lista de Favoritos -->
        <div class="favorites-list">
            <div class="favorite-item">
                <i class="star-icon">&#9733;</i>
                <span>Parque 1</span>
            </div>
            <div class="favorite-item">
                <i class="star-icon">&#9733;</i>
                <span>Parque 2</span>
            </div>
            <div class="favorite-item">
                <i class="star-icon">&#9733;</i>
                <span>Parque 3</span>
            </div>
            <button class="add-friend-btn">
                <i class="plus-icon">&#43;</i>
                Adicionar Amigo
            </button>
        </div>

        <!-- Rodapé -->
        <footer class="footer">
            <div class="footer-item">Amigos</div>
            <div class="footer-item">Atividades</div>
            <div class="footer-item">Início</div>
            <div class="footer-item">Favoritos</div>
            <div class="footer-item">Conta</div>
        </footer>
    </div>

</body>
</html>
