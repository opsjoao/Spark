<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPARK</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Tela de Splash -->
  <div id="splash">
    <img src="sparklogo.svg" alt="Logo SPARK">
    <h1>SPARK</h1>
  </div>

  <script>
    // Controla tempo da splash
    setTimeout(() => {
      document.getElementById("splash").style.display = "none";
      document.getElementById("conteudo").style.display = "block";
    }, 3000); // 3 segundos
  </script>
</body>
</html>
