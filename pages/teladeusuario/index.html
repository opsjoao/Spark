<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tela de Usuário</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
    .screen { display: none; padding: 32px 16px; max-width: 400px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; }
    .screen.active { display: block; }
    .nav { display: flex; gap: 8px; margin-bottom: 24px; }
    .nav button { flex: 1; padding: 10px; border: none; border-radius: 6px; background: #eee; cursor: pointer; font-size: 16px; }
    .nav button.active { background: #0078d4; color: #fff; }
    label { display: block; margin-top: 18px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; }
    .actions { margin-top: 28px; display: flex; gap: 10px; }
    .actions button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-size: 16px; }
    .save { background: #0078d4; color: #fff; }
    .cancel { background: #eee; }
    .profile-info { margin: 24px 0; }
    .profile-info div { margin-bottom: 8px; }
  </style>
</head>
<body>
  <!-- Tela de Configurações -->
  <div id="screen-settings" class="screen active">
    <div class="nav">
      <button class="active">Perfil</button>
      <button onclick="goToEdit()">Editar</button>
    </div>
    <h2>Configurações do Perfil</h2>
    <div class="profile-info">
      <div><strong>Nome:</strong> <span id="displayName">Nome de Usuário</span></div>
      <div><strong>Email:</strong> <span id="displayEmail">usuario@email.com</span></div>
    </div>
  </div>

  <!-- Tela de Edição -->
  <div id="screen-edit" class="screen">
    <div class="nav">
      <button onclick="goBack()">Perfil</button>
      <button class="active">Editar</button>
    </div>
    <h2>Editar Perfil</h2>
    <form onsubmit="event.preventDefault(); saveProfile();">
      <label for="inName">Nome</label>
      <input type="text" id="inName" placeholder="Digite seu nome">

      <label for="inEmail">Email</label>
      <input type="email" id="inEmail" placeholder="Digite seu email">

      <label for="inPhone">Telefone</label>
      <input type="tel" id="inPhone" placeholder="Digite seu telefone">

      <div class="actions">
        <button type="button" class="cancel" onclick="goBack()">Cancelar</button>
        <button type="submit" class="save">Salvar</button>
      </div>
    </form>
  </div>

<nav class="bottombar">
    <button class="nav-btn" onclick="window.location.href='../TelaPerfils/perfil.html'">
      <i class="fa-solid fa-users"></i>
    </button>
    <button class="nav-btn" onclick="window.location.href='/telas-mapas/index.html'">
      <i class="fa-solid fa-person-walking"></i>
    </button>
    <button class="nav-btn" onclick="window.location.href='../tela-principal/telaprincipal.html'">
      <i class="fa-solid fa-house"></i>
    </button>
    <button class="nav-btn" onclick="window.location.href='/telaFavoritos/index.html'">
      <i class="fa-solid fa-star"></i>
    </button>
    <button class="nav-btn active" onclick="window.location.href='/teladeusuario.html'">
      <i class="fa-solid fa-user"></i>
    </button>
  </nav>


  
  <script src="script.js"></script>
</body>

</html>
