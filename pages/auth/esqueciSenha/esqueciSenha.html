<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="styles/styles.css"> 
    <title>Recuperar a Senha</title>
</head>
<body>
    <main id="form_container">
        <div id="form_header">
            <h1 id="form_title" style="font-size: 20pt;">
                Recuperar Senha
            </h1>
            <button class="btn-default" onclick="window.location.href='../'">
                <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </div>

        <form action="confirmaEmail.php" id="form" method="POST">
            <div id="input_container">

                <div class="input-box">
                    <label for="email" class="form-label">E-mail</label>
                    <div class="input-field">
                        <input 
                            type="email"
                            name="email"
                            id="email"
                            class="form-control"
                            placeholder="exemplo@gmail.com"
                            required
                        >
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                </div>

                <div class="input-box">
                    <label for="confirm_email" class="form-label">Confirmar email</label>
                    <div class="input-field">
                        <input 
                            type="email"
                            name="confirm_email"
                            id="confirm_email"
                            class="form-control"
                            placeholder="Confirme o email"
                            required
                        >
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                    <span id="email-error" style="color: red; font-size: 12px; display: none; width: 100%; margin-top: 5px;"></span>
                </div>
            </div>

            <button type="submit" class="btn-default">
                <i class="fa-solid fa-check"></i>
                Recuperar Senha
            </button>
        </form>
    </main>

    <script src="javascript/script.js"></script>
</body>
</html>
