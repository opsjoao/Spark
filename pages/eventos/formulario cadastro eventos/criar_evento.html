<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Novo Evento</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div id="form_container">
        <div id="form_header">
            <h1 id="form_title">Cadastrar Novo Evento</h1>
        </div>

        <form id="form" action="cadastro_evento.php" method="POST" enctype="multipart/form-data">
            <div id="input_container">
                
                <div class="input-box">
                    <label class="form-label" for="nomeParque">Nome do Parque</label>
                    <div class="input-field">
                        <input class="form-control" type="text" id="nomeParque" name="nomeParque" placeholder="Digite o nome do parque" required>
                    </div>
                </div>

                <div class="input-box">
                    <label class="form-label" for="enderecoParque">Endereço do Parque</label>
                    <div class="input-field">
                        <input class="form-control" type="text" id="enderecoParque" name="enderecoParque" placeholder="Ex: Av. Afonso de Sampaio e Sousa, 951" required>
                    </div>
                </div>

                <div class="input-box">
                    <label class="form-label" for="cepParque">CEP</label>
                    <div class="input-field">
                        <input class="form-control" type="text" id="cepParque" name="cepParque" placeholder="Ex: 03590-000" required>
                    </div>
                </div>
                <div class="input-box">
                    <label class="form-label" for="nomeEvento">Nome do Evento</label>
                    <div class="input-field">
                        <input class="form-control" type="text" id="nomeEvento" name="nomeEvento" placeholder="Ex: Aula de Yoga ao ar livre" required>
                    </div>
                </div>

                <div class="input-box">
                    <label class="form-label" for="dataEvento">Data do Evento</label>
                    <div class="input-field">
                        <input class="form-control" type="date" id="dataEvento" name="dataEvento" required>
                    </div>
                </div>

                <div class="input-box">
                    <label class="form-label" for="horaInicio">Hora de Início</label>
                    <div class="input-field">
                        <input class="form-control" type="time" id="horaInicio" name="horaInicio" required>
                    </div>
                </div>

                <div class="input-box">
                    <label class="form-label" for="horaTermino">Hora de Término</label>
                    <div class="input-field">
                        <input class="form-control" type="time" id="horaTermino" name="horaTermino" required>
                    </div>
                </div>

                <div class="input-box">
                    <label class="form-label" for="descricaoEvento">Descrição</label>
                    <div class="input-field">
                        <textarea class="form-control" id="descricaoEvento" name="descricaoEvento" rows="4" placeholder="Descreva brevemente o evento..."></textarea>
                    </div>
                </div>

                <div class="input-box">
                    <label class="form-label" for="imagemEvento">Imagem do Evento (Opcional)</label>
                    <div class="input-field">
                        <input class="form-control" type="file" id="imagemEvento" name="imagemEvento" accept="image/png, image/jpeg, image/gif">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-default">
                <i class="fa-solid fa-check"></i>
                Cadastrar Evento
            </button>
        </form>
    </div>
</body>
</html>
