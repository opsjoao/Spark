<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
    <h1>Fórmulário de Inscrição de Eventos</h1>
    
    <main>
    <form action="/enviar" method="POST">
        <!-- Campo para Nome Usuário -->
        <label for="idUsuario">Usuário:</label><br>
        <input type="text" id="idUsuario" name="nome" required><br><br>

        <!-- Campo para ID Usuário -->
        <label for="idUsuario">Identificador do usuário:</label><br>
        <input type="text" id="idUsuario" name="idUsuario" required><br><br>
        
        <!-- Campo para Nome  Parque -->
        <label for="idParque">Parque:</label><br>
        <input type="text" id="idParque" name="nome" required><br><br>

        <!-- Campo para Nome Evento -->
        <!-- O ID evento tem que ser gerado junto com o evento-->
        <label for="idEvento">Nome do evento:</label><br>
        <input type="text" id="idEvento" name="nomeEvento" required><br><br>

        <!-- Campo para Data do Evento -->
        <label for="idEvento">Data do evento:</label><br>
        <input type="date" id="idEvento" name="dia" required><br><br>

        <!-- Campo para hora de inicio do Evento -->
        <label for="idEvento">início do evento:</label><br>
        <input type="time" id="idEvento" name="horario_inicio" required><br><br>

        <!-- Campo para hora de término do Evento -->
        <label for="idEvento">Término do evento:</label><br>
        <input type="time" id="idEvento" name="horario_termino" required><br><br>

        <!-- Campo para Descricao -->
        <label for="idEvento">Descrição:</label><br>
        <textarea id="idEvento" name="descrição" rows="4" cols="50" required></textarea><br><br>

         <button type="sumbit" class="btn-default">
                <i class="fa-solid fa-check"></i>
                Cadastrar Evento
            </button>
        </form>
        </main>

</body>
</html>
