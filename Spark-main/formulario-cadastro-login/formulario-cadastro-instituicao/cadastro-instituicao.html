<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../formulario-cadastro-usuario/src/styles/styles.css">
    <title>Cadastrar Instituição</title>
</head>
<body>
    <main id="form_container">
        <div id="form_header">
            <h1 id="form_title" style="font-size: 20pt;">Cadastrar Instituição</h1>
            <button class="btn-default" onclick="window.location.href='../formulario-login/login.php'">
                <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </div>
        <div class="radio-container-1">
            <div id="gender_inputs">
                <div class="radio-box">
                    <input type="radio" name="form_type" id="user" class="form-control" onclick="window.location.href='../formulario-cadastro-usuario/cadastro-usuario.html'">
                    <label for="user" class="form-label">Usuário</label>
                </div>
                <div class="radio-box">
                    <input type="radio" name="form_type" id="institution" class="form-control" checked>
                    <label for="institution" class="form-label">Instituição</label>
                </div>
            </div>
        </div>
        
        <form action="cadastro-instituicao.php" id="form" method="POST">
            <div id="input_container">
                <div class="input-box">
                    <label for="nome_instituicao" class="form-label">Nome da Instituição</label>
                    <div class="input-field">
                        <input type="text" name="nome_instituicao" id="nome_instituicao" class="form-control" required>
                        <i class="fa-solid fa-building"></i>
                    </div>
                </div>

                <div class="input-box">
                    <label for="username" class="form-label">Nome de Usuário (login)</label>
                    <div class="input-field">
                        <input type="text" name="username" id="username" class="form-control" placeholder="@usuario_da_instituicao" required>
                        <i class="fa-solid fa-at"></i>
                    </div>
                </div>

                <div class="input-box">
                    <label for="cnpj" class="form-label">CNPJ</label>
                    <div class="input-field">
                        <input type="text" name="cnpj" id="cnpj" class="form-control" required>
                        <i class="fa-regular fa-id-card"></i>
                    </div>
                </div>

                <div class="input-box">
                    <label for="email" class="form-label">E-mail</label>
                    <div class="input-field">
                        <input type="email" name="email" id="email" class="form-control" required>
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                </div>

                <div class="input-box">
                    <label for="password" class="form-label">Senha</label>
                    <div class="input-field">
                        <input type="password" name="password" id="password" class="form-control" required>
                        <i class="fa-regular fa-eye-slash"></i>
                    </div>
                </div>

                 <div class="input-box">
                    <label for="confirm_password" class="form-label">Confirmar Senha</label>
                    <div class="input-field">
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control" required>
                        <i class="fa-regular fa-eye-slash"></i>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-default">
                <i class="fa-solid fa-check"></i>
                Criar conta de Instituição
            </button>
        </form>
    </main>
</body>
</html>
