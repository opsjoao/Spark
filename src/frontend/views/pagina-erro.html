<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Não Encontrada</title>
    <style>
      
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center; 
            padding: 20px; 
            background-color: #448019;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%; 
            margin: auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { 
            font-size: 72px; 
            color: #4a4a4a; 
            margin: 0;
        }
        h2 {
            font-size: 24px;
            color: #333;
        }
        p { 
            font-size: 16px; 
            color: #666; 
            line-height: 1.6; 
        }
        a.botao {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            font-size: 16px; 
            background-color: #007BFF;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        a.botao:hover {
            background-color: #06b300;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 56px; 
            }
            h2 {
                font-size: 20px; 
            }
            .container {
                padding: 20px; 
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Página Não Encontrada</h2>
        <p>Parece que o link que você seguiu está quebrado ou a página foi removida.</p>
        <a href="/" class="botao">Voltar para a Página Inicial</a>
    </div>
</body>
</html>
