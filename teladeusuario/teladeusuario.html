<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spark — Conta</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        referrerpolicy="no-referrer"/>

  <link rel="stylesheet" href="teladeusuario.css" />
</head>
<body>

  <header class="appbar">
    <button class="icon-btn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    <h1>Spark</h1>
    <button class="icon-btn" aria-label="Buscar"><i class="fa-solid fa-magnifying-glass"></i></button>
  </header>

  <main class="app-content">
    
    <section id="screen-settings" class="screen active">
    
      <div class="card profile-card">
        <img class="avatar" id="avatarMain" src="https://via.placeholder.com/80" alt="Foto do perfil" />
        <div class="profile-meta">
          <span class="hello">Olá,</span>
          <h2 class="username" id="displayName">Nome de Usuário</h2>
          <span class="email" id="displayEmail">usuario@email.com</span>
        </div>
        <button class="pill-btn" onclick="goToEdit()">
          <i class="fa-solid fa-pen"></i>
          Editar
        </button>
      </div>

      <div class="list">
        <button class="list-item" onclick="goToEdit()">
          <div class="li-left">
            <i class="fa-solid fa-id-card-clip"></i>
            <span>Informações Pessoais</span>
          </div>
          <i class="fa-solid fa-angle-right"></i>
        </button>

        <button class="list-item">
          <div class="li-left">
            <i class="fa-solid fa-envelope"></i>
            <span>Mensagens</span>
          </div>
          <i class="fa-solid fa-angle-right"></i>
        </button>

        <button class="list-item">
          <div class="li-left">
            <i class="fa-solid fa-key"></i>
            <span>Alterar Senha</span>
          </div>
          <i class="fa-solid fa-angle-right"></i>
        </button>

        <button class="list-item">
          <div class="li-left">
            <i class="fa-solid fa-circle-info"></i>
            <span>Suporte</span>
          </div>
          <i class="fa-solid fa-angle-right"></i>
        </button>

        <button class="list-item danger">
          <div class="li-left">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span>Sair</span>
          </div>
        </button>
      </div>
    </section>

   
    <section id="screen-edit" class="screen">
  
      <div class="subbar">
        <button class="icon-btn" onclick="goBack()" aria-label="Voltar">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h2>Editar Perfil</h2>
        <button class="text-btn" onclick="saveProfile()">Salvar</button>
      </div>

     
      <div class="edit-wrap">
        <div class="avatar-wrap">
          <img class="avatar big" id="avatarEdit" src="https://via.placeholder.com/100" alt="Foto do perfil" />
          <button class="avatar-fab" aria-label="Trocar foto">
            <i class="fa-solid fa-camera"></i>
          </button>
        </div>

        <form id="editForm" class="form">
          <label for="inName">Nome de Usuário</label>
          <input id="inName" type="text" value="Nome de Usuário" />

          <label for="inEmail">Email</label>
          <input id="inEmail" type="email" value="usuario@email.com" />

          <label for="inPhone">Número de Telefone</label>
          <input id="inPhone" type="tel" placeholder="(00) 00000-0000" value="(00) 00000-0000" />
        </form>
      </div>
    </section>
  </main>

 
  <nav class="navbar">
    <button class="nav-btn">
      <i class="fa-solid fa-users"></i>
      <span>Amigos</span>
    </button>
    <button class="nav-btn">
      <i class="fa-solid fa-person-walking"></i>
      <span>Atividades</span>
    </button>
    <button class="nav-btn">
      <i class="fa-solid fa-house"></i>
      <span>Início</span>
    </button>
    <button class="nav-btn">
      <i class="fa-solid fa-star"></i>
      <span>Favoritos</span>
    </button>
    <button class="nav-btn active">
      <span class="icon-badge"><i class="fa-solid fa-user"></i></span>
      <span>Conta</span>
    </button>
  </nav>


  <script src="script.js"></script>
</body>
</html>
